<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE ARK</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Auth Container -->
  <div id="authContainer">
    <div class="auth-modal">
      <div class="logo">
        <svg width="40" height="28" viewBox="0 0 40 28">
          <path d="M2 10 L38 10 L32 24 L8 24 Z" stroke="#3fa88c" stroke-width="2" fill="none"/>
          <line x1="20" y1="2" x2="20" y2="10" stroke="#3fa88c" stroke-width="2"/>
        </svg>
        <h1>THE ARK</h1>
      </div>
      <p class="subtitle">Knowledge preserved through the noise</p>
      
      <form id="authForm">
        <div id="authToggle">
          <button type="button" class="active" data-mode="signin">Sign In</button>
          <button type="button" data-mode="signup">Sign Up</button>
        </div>
        
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="Enter your email">
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="Enter your password">
        </div>
        
        <div class="form-group" id="nameGroup" style="display:none;">
          <label for="displayName">Display Name</label>
          <input type="text" id="displayName" placeholder="Your name">
        </div>
        
        <button type="submit" id="authSubmit">Sign In</button>
        <div class="auth-links">
          <button type="button" id="resetPasswordLink">Forgot password?</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Main App -->
  <div id="appContainer" style="display:none;">
    <header class="ark-header">
      <div class="wordmark">
        <svg width="20" height="14" viewBox="0 0 20 14">
          <path d="M1 5 L19 5 L16 12 L4 12 Z" stroke="#e9e6de" stroke-width="1.2"/>
          <line x1="10" y1="1" x2="10" y2="5" stroke="#e9e6de" stroke-width="1.2"/>
        </svg>
        <span>THE ARK</span>
      </div>
      <div class="header-icons">
        <button id="settings" class="settings-btn">⚙︎</button>
        <button id="signOutBtn" class="auth-btn">Sign Out</button>
      </div>
    </header>

    <div class="verify-banner" id="verifyBanner" style="display:none;">
      <span>Verify your email to unlock posting.</span>
      <div class="verify-banner-actions">
        <button id="resendVerifyBtn" type="button">Resend</button>
        <button id="refreshVerifyBtn" type="button">I've verified</button>
      </div>
    </div>

    <nav class="topic-tabs" id="tabContainer">
      <span class="tab active" data-tab="for-you">FOR YOU</span>
      <span class="tab" data-tab="monetary">MONETARY POLICY</span>
      <span class="tab" data-tab="space">SPACE</span>
      <span class="tab" data-tab="health">HEALTH</span>
    </nav>

    <div id="feedContainer"></div>

    <div class="depth-nudge" id="depthNudge">
      <span>↓</span> after 2 clips, dive deeper <span class="arrow">→</span> <span>ARTICLE</span>
    </div>

    <div class="bottom-bar">
      <svg class="active" data-tab="home" viewBox="0 0 24 24">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
      </svg>
      <svg data-tab="explore" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10"/>
        <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>
      </svg>
      <svg data-tab="create" viewBox="0 0 24 24">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      <svg data-tab="profile" viewBox="0 0 24 24">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
    </div>

    <div class="source-panel" id="sourcePanel">
      <div class="handle"></div>
      <h4>SOURCES ATTACHED</h4>
      <div id="sourceList"></div>
      <div class="close-panel" id="closePanel">✕ close sources</div>
    </div>

    <div class="source-panel profile-panel" id="profilePanel">
      <div class="handle"></div>

      <div id="profileView">
        <div class="profile-header">
          <div class="profile-avatar" id="profileAvatar">--</div>
          <div>
            <div class="profile-name" id="profileName">—</div>
            <div class="profile-handle" id="profileHandle">—</div>
          </div>
        </div>
        <p class="profile-bio" id="profileBio"></p>
        <div class="profile-stats">
          <div><span id="profileFollowers">0</span><label>followers</label></div>
          <div><span id="profileRole">creator</span><label>role</label></div>
        </div>
        <button class="auth-btn profile-follow-btn" id="profileFollowBtn" style="display:none;">Follow</button>
        <button class="auth-btn profile-edit-btn" id="profileEditBtn" style="display:none;">Edit Profile</button>
      </div>

      <form id="profileEditForm" style="display:none;">
        <div class="form-group">
          <label for="editDisplayName">Display Name</label>
          <input type="text" id="editDisplayName" placeholder="Your name">
        </div>
        <div class="form-group">
          <label for="editBio">Bio</label>
          <input type="text" id="editBio" placeholder="A short bio">
        </div>
        <button type="submit" id="profileSaveBtn">Save Changes</button>
      </form>

      <div class="close-panel" id="closeProfilePanel">✕ close profile</div>
    </div>

    <div class="source-panel profile-panel" id="createPanel">
      <div class="handle"></div>
      <h4>NEW POST</h4>

      <form id="createForm">
        <div id="createTypeToggle" class="create-type-toggle">
          <button type="button" class="active" data-type="clip">Clip</button>
          <button type="button" data-type="card">Card</button>
          <button type="button" data-type="article">Article</button>
        </div>

        <div class="form-group">
          <label for="createHeadline">Headline</label>
          <input type="text" id="createHeadline" required placeholder="What's this about?">
        </div>

        <div class="form-group">
          <label for="createTopic">Topic</label>
          <select id="createTopic">
            <option value="">For You (no specific topic)</option>
            <option value="Monetary Policy">Monetary Policy</option>
            <option value="Space">Space</option>
            <option value="Health">Health</option>
          </select>
        </div>

        <div class="form-group create-field-clip">
          <label for="createVideoUrl">Video URL</label>
          <input type="url" id="createVideoUrl" placeholder="https://...">
          <label for="createDuration" style="margin-top:8px;">Duration</label>
          <input type="text" id="createDuration" placeholder="0:58">
        </div>

        <div class="form-group create-field-card" style="display:none;">
          <label>Slides</label>
          <div id="slideList"></div>
          <button type="button" id="addSlideBtn" class="add-row-btn">+ Add slide</button>
        </div>

        <div class="form-group create-field-article" style="display:none;">
          <label for="createContent">Content</label>
          <textarea id="createContent" rows="5" placeholder="Write the full piece..."></textarea>
        </div>

        <div class="form-group">
          <label>Sources</label>
          <div id="sourceInputList"></div>
          <button type="button" id="addSourceBtn" class="add-row-btn">+ Add source</button>
        </div>

        <button type="submit" id="publishBtn">Publish</button>
      </form>

      <div class="close-panel" id="closeCreatePanel">✕ close</div>
    </div>

    <div class="toast" id="toast"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/firebase-init.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/profile.js"></script>
  <script src="/js/feed.js"></script>
  <script src="/js/create.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
