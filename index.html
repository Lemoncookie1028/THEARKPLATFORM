<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>THE ARK · knowledge feed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0b0d0f;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 20px;
      font-family: 'Inter', -apple-system, sans-serif;
      color: #e9e6de;
    }

    .ark-container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    @media (min-width: 820px) {
      .ark-container {
        flex-direction: row;
        align-items: flex-start;
        gap: 30px;
      }
      .feed-column {
        flex: 1;
        min-width: 0;
      }
      .sidebar {
        width: 320px;
        flex-shrink: 0;
        position: sticky;
        top: 20px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .phone {
        border-radius: 20px;
        border: 1px solid #2a2f35;
        box-shadow: 0 30px 60px rgba(0,0,0,0.6);
      }
    }

    @media (max-width: 819px) {
      .sidebar {
        display: none;
      }
      .phone {
        border-radius: 20px;
        border: 1px solid #2a2f35;
        box-shadow: 0 30px 60px rgba(0,0,0,0.6);
        width: 100%;
        max-width: 500px;
        margin: 0 auto;
      }
      .feed-column {
        display: flex;
        justify-content: center;
      }
    }

    .phone {
      background: #14171a;
      overflow: hidden;
      transition: all 0.1s ease;
    }

    .ark-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px 12px 20px;
      border-bottom: 1px solid #2a2f35;
    }
    .wordmark {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: default;
    }
    .wordmark svg { display: block; }
    .wordmark span {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 14px;
      letter-spacing: 0.12em;
      color: #e9e6de;
    }
    .header-icons {
      display: flex;
      gap: 16px;
      color: #a6a399;
    }
    .header-icons svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      cursor: pointer;
      transition: stroke 0.2s;
    }
    .header-icons svg:hover { stroke: #e9e6de; }

    .topic-tabs {
      display: flex;
      gap: 12px;
      padding: 12px 20px;
      border-bottom: 1px solid #2a2f35;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.04em;
      flex-wrap: wrap;
      background: #14171a;
    }
    .topic-tabs .tab {
      padding-bottom: 8px;
      cursor: pointer;
      color: #6f6d66;
      transition: color 0.15s, border-color 0.15s;
      border-bottom: 2px solid transparent;
      user-select: none;
    }
    .topic-tabs .tab.active {
      color: #e9e6de;
      border-bottom-color: #e9e6de;
    }
    .topic-tabs .tab:hover { color: #c5c1b6; }

    .card {
      position: relative;
      border-bottom: 1px solid #2a2f35;
      background: #14171a;
      transition: background 0.15s;
      cursor: pointer;
    }
    .card:active { background: #1a1e22; }

    .perf-border {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 14px;
      background-image: radial-gradient(circle at 4px 8px, #3a4048 1.2px, transparent 1.2px);
      background-size: 14px 10px;
      background-position: 0 0;
      pointer-events: none;
    }
    .card-body {
      padding: 16px 18px 16px 28px;
    }
    .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.04em;
      color: #6f6d66;
      margin-bottom: 8px;
    }
    .headline {
      font-family: 'Source Serif 4', Georgia, serif;
      font-size: 17px;
      line-height: 1.45;
      color: #e9e6de;
      margin-bottom: 10px;
      cursor: default;
    }
    .stamp-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }
    .stamp {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      padding: 3px 10px;
      border-radius: 4px;
      background: #20252a;
      color: #a6a399;
      display: inline-block;
    }
    .stamp.teal { background: #1c2b27; color: #3fa88c; }
    .stamp.amber { background: #2b2419; color: #d89b4a; }
    .stamp.neutral { background: #1b1f23; color: #a6a399; }

    .waterline {
      height: 3px;
      background: #20252a;
      border-radius: 2px;
      overflow: hidden;
      margin: 10px 0 4px;
    }
    .waterline .fill {
      height: 100%;
      background: #3fa88c;
      width: 82%;
    }
    .waterline .fill.amber { background: #d89b4a; width: 46%; }

    .waterline-label {
      display: flex;
      justify-content: space-between;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      color: #6f6d66;
    }

    .slide-dots {
      display: flex;
      gap: 5px;
      margin-top: 12px;
    }
    .slide-dots span {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: #3a4048;
    }
    .slide-dots span:first-child { background: #a6a399; }

    .snippet {
      font-size: 13px;
      color: #a6a399;
      line-height: 1.5;
      margin-top: 4px;
    }
    .source-out {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid #2a2f35;
      font-size: 12px;
      color: #a6a399;
    }
    .source-out .out-link {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: color 0.2s;
      text-decoration: none;
      color: #a6a399;
    }
    .source-out .out-link:hover { color: #e9e6de; }
    .source-out svg {
      width: 14px; height: 14px;
      stroke: #6f6d66;
      fill: none;
      stroke-width: 2;
    }
    .source-out .out-link:hover svg { stroke: #e9e6de; }

    .profile-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
    }
    .profile-badge .avatar {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #2a2f35;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
      color: #a6a399;
      overflow: hidden;
    }
    .profile-badge .name {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      color: #a6a399;
    }
    .profile-badge .name strong {
      color: #e9e6de;
      font-weight: 500;
    }

    .bottom-bar {
      display: flex;
      justify-content: space-around;
      padding: 14px 0 16px 0;
      border-top: 1px solid #2a2f35;
      background: #14171a;
    }
    .bottom-bar svg {
      width: 20px; height: 20px;
      stroke: #6f6d66;
      fill: none;
      stroke-width: 2;
      cursor: pointer;
      transition: stroke 0.2s;
    }
    .bottom-bar svg.active { stroke: #e9e6de; }
    .bottom-bar svg:hover { stroke: #c5c1b6; }

    .depth-nudge {
      background: #1b1f23;
      padding: 12px 20px;
      text-align: center;
      font-size: 12px;
      color: #a6a399;
      border-top: 1px solid #2a2f35;
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .depth-nudge:hover {
      background: #23282e;
      color: #e9e6de;
    }
    .depth-nudge span {
      color: #3fa88c;
      font-weight: 500;
    }
    .depth-nudge .arrow {
      display: inline-block;
      transition: transform 0.25s ease;
    }
    .depth-nudge:hover .arrow {
      transform: translateX(4px);
    }

    .source-panel {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #1b1f23;
      border-top: 1px solid #3a4048;
      padding: 20px 24px 30px;
      border-radius: 20px 20px 0 0;
      max-width: 500px;
      margin: 0 auto;
      box-shadow: 0 -10px 40px rgba(0,0,0,0.7);
      z-index: 100;
      transform: translateY(100%);
      transition: transform 0.3s ease;
    }
    .source-panel.open {
      transform: translateY(0);
      display: block;
    }
    .source-panel .handle {
      width: 40px;
      height: 4px;
      background: #3a4048;
      border-radius: 2px;
      margin: 0 auto 16px;
    }
    .source-panel h4 {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.06em;
      color: #6f6d66;
      margin-bottom: 8px;
    }
    .source-panel .source-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #2a2f35;
      font-size: 13px;
      color: #a6a399;
    }
    .source-panel .source-item:last-child { border-bottom: none; }
    .source-panel .source-item .badge {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
      background: #20252a;
      padding: 2px 8px;
      border-radius: 12px;
      color: #6f6d66;
    }
    .source-panel .close-panel {
      margin-top: 12px;
      text-align: center;
      color: #6f6d66;
      font-size: 12px;
      cursor: pointer;
      padding: 8px;
      border-radius: 8px;
      transition: background 0.2s;
    }
    .source-panel .close-panel:hover {
      background: #2a2f35;
      color: #e9e6de;
    }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1b1f23;
      border: 1px solid #3a4048;
      padding: 10px 20px;
      border-radius: 40px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      color: #e9e6de;
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s ease;
      pointer-events: none;
      white-space: nowrap;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      z-index: 200;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .sidebar-card {
      background: #14171a;
      border: 1px solid #2a2f35;
      border-radius: 16px;
      padding: 20px;
    }
    .sidebar-card h3 {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.06em;
      color: #6f6d66;
      margin-bottom: 12px;
    }
    .profile-list .profile-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #2a2f35;
    }
    .profile-list .profile-item:last-child { border-bottom: none; }
    .profile-item .avatar-lg {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #2a2f35;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      color: #a6a399;
      flex-shrink: 0;
    }
    .profile-item .info {
      flex: 1;
    }
    .profile-item .info .name {
      font-size: 13px;
      color: #e9e6de;
    }
    .profile-item .info .handle {
      font-size: 11px;
      color: #6f6d66;
      font-family: 'IBM Plex Mono', monospace;
    }
    .profile-item .follow-btn {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      padding: 4px 12px;
      border-radius: 12px;
      border: 1px solid #3a4048;
      background: transparent;
      color: #a6a399;
      cursor: pointer;
      transition: all 0.2s;
    }
    .profile-item .follow-btn:hover {
      border-color: #3fa88c;
      color: #e9e6de;
    }
    .profile-item .follow-btn.following {
      border-color: #3fa88c;
      color: #3fa88c;
    }

    .trending-list .trend-item {
      padding: 8px 0;
      border-bottom: 1px solid #2a2f35;
      font-size: 13px;
      color: #a6a399;
      cursor: pointer;
      transition: color 0.2s;
    }
    .trending-list .trend-item:last-child { border-bottom: none; }
    .trending-list .trend-item:hover { color: #e9e6de; }
    .trending-list .trend-item .topic {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      color: #6f6d66;
      display: block;
      margin-top: 2px;
    }

    .auth-btn {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      padding: 6px 16px;
      border-radius: 12px;
      border: 1px solid #3a4048;
      background: transparent;
      color: #a6a399;
      cursor: pointer;
      transition: all 0.2s;
    }
    .auth-btn:hover {
      border-color: #3fa88c;
      color: #e9e6de;
    }
    .auth-btn.active {
      border-color: #3fa88c;
      color: #3fa88c;
    }

    @media (max-width: 819px) {
      .sidebar { display: none; }
      .source-panel { max-width: 100%; border-radius: 16px 16px 0 0; }
    }
  </style>
</head>
<body>

<div class="ark-container">
  <div class="feed-column">
    <div class="phone">

      <header class="ark-header">
        <div class="wordmark">
          <svg width="20" height="14" viewBox="0 0 20 14" fill="none" stroke="#e9e6de" stroke-width="1.2">
            <path d="M1 5 L19 5 L16 12 L4 12 Z" stroke="currentColor"/>
            <line x1="10" y1="1" x2="10" y2="5" stroke="currentColor"/>
          </svg>
          <span>THE ARK</span>
        </div>
        <div class="header-icons">
          <button class="auth-btn" id="authBtn">Sign In</button>
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        </div>
      </header>

      <nav class="topic-tabs" id="tabContainer">
        <span class="tab active" data-tab="for-you">FOR YOU</span>
        <span class="tab" data-tab="monetary">MONETARY POLICY</span>
        <span class="tab" data-tab="space">SPACE</span>
        <span class="tab" data-tab="health">HEALTH</span>
      </nav>

      <div id="feedContainer">
        <!-- Cards will be rendered by Firebase -->
      </div>

      <div class="depth-nudge" id="depthNudge">
        <span>↓</span>  after 2 clips, dive deeper  <span class="arrow">→</span>  <span>ARTICLE</span>
      </div>

      <div class="bottom-bar">
        <svg class="active" data-tab="home" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <svg data-tab="explore" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
        <svg data-tab="compose" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <svg data-tab="profile" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>

      <div class="source-panel" id="sourcePanel">
        <div class="handle"></div>
        <h4>SOURCES ATTACHED</h4>
        <div id="sourceList">
          <div class="source-item"><span>🔗</span> Loading sources... <span class="badge">...</span></div>
        </div>
        <div class="close-panel" id="closePanel">✕ close sources</div>
      </div>

      <div class="toast" id="toast"></div>
    </div>
  </div>

  <aside class="sidebar">
    <div class="sidebar-card">
      <h3>TOP CREATORS</h3>
      <div class="profile-list" id="creatorList">
        <!-- Will be populated from Firebase -->
      </div>
    </div>

    <div class="sidebar-card">
      <h3>TRENDING TOPICS</h3>
      <div class="trending-list" id="trendingList">
        <!-- Will be populated from Firebase -->
      </div>
    </div>

    <div class="sidebar-card">
      <h3>NEWS SOURCES</h3>
      <div style="display:flex;flex-wrap:wrap;gap:8px;">
        <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:#a6a399;background:#20252a;padding:4px 12px;border-radius:12px;">Reuters</span>
        <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:#a6a399;background:#20252a;padding:4px 12px;border-radius:12px;">AP</span>
        <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:#a6a399;background:#20252a;padding:4px 12px;border-radius:12px;">BBC</span>
        <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:#a6a399;background:#20252a;padding:4px 12px;border-radius:12px;">Bloomberg</span>
        <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:#a6a399;background:#20252a;padding:4px 12px;border-radius:12px;">FT</span>
        <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:#a6a399;background:#20252a;padding:4px 12px;border-radius:12px;">NPR</span>
      </div>
      <p style="font-size:11px;color:#6f6d66;margin-top:12px;font-family:'IBM Plex Mono',monospace;">Real wire feeds aggregated via RSS/API</p>
    </div>
  </aside>
</div>

<script>
  // Firebase config
  const firebaseConfig = {
    apiKey: "AIzaSyCo2C4wAtqOmST_0xQoAgB8dx9LYsIbuts",
    authDomain: "thearkplatform.firebaseapp.com",
    projectId: "thearkplatform",
    storageBucket: "thearkplatform.firebasestorage.app",
    messagingSenderId: "1436735808",
    appId: "1:1436735808:web:ee7116aaabb7a8970902a5"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();

  // DOM elements
  const feedContainer = document.getElementById('feedContainer');
  const toast = document.getElementById('toast');
  const sourcePanel = document.getElementById('sourcePanel');
  const closePanel = document.getElementById('closePanel');
  const authBtn = document.getElementById('authBtn');
  const creatorList = document.getElementById('creatorList');
  const trendingList = document.getElementById('trendingList');

  let toastTimer = null;
  let currentUser = null;

  // Toast system
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      toast.classList.remove('show');
    }, 2200);
  }

  // Auth
  auth.onAuthStateChanged(user => {
    currentUser = user;
    if (user) {
      authBtn.textContent = 'Sign Out';
      authBtn.classList.add('active');
      showToast('Welcome, ' + (user.displayName || user.email || 'User'));
    } else {
      authBtn.textContent = 'Sign In';
      authBtn.classList.remove('active');
    }
  });

  authBtn.addEventListener('click', async () => {
    if (currentUser) {
      await auth.signOut();
      showToast('Signed out');
    } else {
      try {
        const provider = new firebase.auth.GoogleAuthProvider();
        await auth.signInWithPopup(provider);
        showToast('Signed in successfully');
      } catch (error) {
        showToast('Sign in failed: ' + error.message);
      }
    }
  });

  // Source panel
  function openSourcePanel(headline) {
    const list = document.getElementById('sourceList');
    const sources = [
      { icon: '🔗', label: 'Primary source: ' + headline.substring(0, 24) + '…', badge: 'verified' },
      { icon: '📄', label: 'Supporting document', badge: 'attached' },
      { icon: '📊', label: 'Peer review summary', badge: 'external' },
    ];
    list.innerHTML = sources.map(s => 
      `<div class="source-item"><span>${s.icon}</span> ${s.label} <span class="badge">${s.badge}</span></div>`
    ).join('');
    sourcePanel.classList.add('open');
    showToast('Sources panel opened');
  }

  function closeSourcePanel() {
    sourcePanel.classList.remove('open');
  }

  closePanel.addEventListener('click', closeSourcePanel);
  document.addEventListener('click', function(e) {
    if (sourcePanel.classList.contains('open') && !sourcePanel.contains(e.target) && !e.target.closest('.card')) {
      closeSourcePanel();
    }
  });

  // Render feed from Firebase
  function renderFeed(posts) {
    feedContainer.innerHTML = '';
    posts.forEach(post => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.type = post.type || 'clip';
      card.dataset.headline = post.headline || '';
      card.dataset.id = post.id;

      const perf = document.createElement('div');
      perf.className = 'perf-border';
      card.appendChild(perf);

      const body = document.createElement('div');
      body.className = 'card-body';

      // Meta
      const meta = document.createElement('div');
      meta.className = 'meta';
      const typeLabel = post.type ? post.type.toUpperCase() : 'CLIP';
      const lengthLabel = post.length || '0:58';
      const sourcesLabel = post.sourceCount || '3 SOURCES';
      meta.innerHTML = `<span>${typeLabel} · ${lengthLabel}</span><span>${sourcesLabel}</span>`;
      body.appendChild(meta);

      // Profile badge
      const badge = document.createElement('div');
      badge.className = 'profile-badge';
      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = post.creatorInitials || 'JD';
      const name = document.createElement('span');
      name.className = 'name';
      name.innerHTML = `<strong>${post.creatorName || 'Jane Doe'}</strong> · ${post.creatorRole || 'creator'}`;
      badge.appendChild(avatar);
      badge.appendChild(name);
      body.appendChild(badge);

      // Headline
      const headline = document.createElement('p');
      headline.className = 'headline';
      headline.textContent = post.headline || 'Untitled post';
      body.appendChild(headline);

      // Stamps
      if (post.stamps && post.stamps.length) {
        const group = document.createElement('div');
        group.className = 'stamp-group';
        post.stamps.forEach(stamp => {
          const s = document.createElement('span');
          s.className = `stamp ${stamp.type || 'neutral'}`;
          s.textContent = stamp.label;
          group.appendChild(s);
        });
        body.appendChild(group);
      }

      // Waterline for clips
      if (post.type === 'clip' && post.confidence) {
        const wl = document.createElement('div');
        wl.className = 'waterline';
        const fill = document.createElement('div');
        fill.className = 'fill';
        fill.style.width = post.confidence + '%';
        wl.appendChild(fill);
        body.appendChild(wl);
        const label = document.createElement('div');
        label.className = 'waterline-label';
        label.innerHTML = `<span>confidence</span><span>${post.confidenceLabel || 'widely supported'}</span>`;
        body.appendChild(label);
      }

      // Slide dots for cards
      if (post.type === 'card' && post.slides) {
        const dots = document.createElement('div');
        dots.className = 'slide-dots';
        for (let i = 0; i < post.slides; i++) {
          const dot = document.createElement('span');
          if (i === 0) dot.style.background = '#a6a399';
          dots.appendChild(dot);
        }
        body.appendChild(dots);
      }

      // Snippet for news
      if (post.type === 'news' && post.snippet) {
        const snippet = document.createElement('p');
        snippet.className = 'snippet';
        snippet.textContent = post.snippet;
        body.appendChild(snippet);
      }

      // Source out for news
      if (post.type === 'news' && post.sourceUrl) {
        const out = document.createElement('div');
        out.className = 'source-out';
        const link = document.createElement('a');
        link.className = 'out-link';
        link.href = '#';
        link.dataset.link = post.sourceUrl;
        link.innerHTML = `
          <svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          <span>Read full on ${post.sourceName || 'source'}</span>
        `;
        out.appendChild(link);
        const via = document.createElement('span');
        via.style.cssText = 'font-size:10px;color:#6f6d66;';
        via.textContent = 'via wire';
        out.appendChild(via);
        body.appendChild(out);
      }

      card.appendChild(body);

      // Click to open source panel
      card.addEventListener('click', function(e) {
        if (e.target.closest('.out-link')) return;
        const headline = this.dataset.headline || this.querySelector('.headline')?.textContent?.trim() || 'post';
        openSourcePanel(headline);
      });

      feedContainer.appendChild(card);
    });
  }

  // Load feed from Firebase
  async function loadFeed() {
    try {
      const snapshot = await db.collection('posts')
        .orderBy('timestamp', 'desc')
        .limit(20)
        .get();

      const posts = [];
      snapshot.forEach(doc => {
        posts.push({ id: doc.id, ...doc.data() });
      });

      if (posts.length === 0) {
        // Seed with sample data if empty
        await seedSampleData();
        return loadFeed();
      }

      renderFeed(posts);
    } catch (error) {
      console.error('Error loading feed:', error);
      showToast('Error loading feed: ' + error.message);
      // Render sample data as fallback
      renderSampleFeed();
    }
  }

  // Fallback render
  function renderSampleFeed() {
    const posts = [
      {
        type: 'clip',
        headline: 'Why the Fed\'s 0.25% move matters more than the number itself',
        creatorName: 'Jane Doe',
        creatorInitials: 'JD',
        creatorRole: 'economist',
        length: '0:58',
        sourceCount: '3 SOURCES',
        confidence: 82,
        confidenceLabel: 'widely supported',
        stamps: []
      },
      {
        type: 'card',
        headline: 'How mRNA vaccines actually teach your immune system',
        creatorName: 'Dr. Rivera',
        creatorInitials: 'DR',
        creatorRole: 'immunology',
        length: '6 SLIDES',
        sourceCount: '1 SOURCE',
        slides: 6,
        stamps: [{ label: 'disputed detail on slide 4', type: 'amber' }]
      },
      {
        type: 'article',
        headline: 'The full case for and against a Mars sample-return mission',
        creatorName: 'orbitalkate',
        creatorInitials: 'OK',
        creatorRole: 'aerospace',
        length: '6 MIN READ',
        sourceCount: '7 SOURCES',
        stamps: [{ label: 'verifier reviewed', type: 'teal' }]
      },
      {
        type: 'news',
        headline: 'Central bank signals pause in rate hikes through Q1',
        sourceName: 'Reuters',
        sourceUrl: 'https://reuters.com',
        snippet: 'Federal Reserve officials indicated a cautious approach to further rate increases, citing cooling inflation and labor market resilience.',
        length: '2H AGO',
        sourceCount: 'via wire'
      }
    ];
    renderFeed(posts);
  }

  // Load creators
  async function loadCreators() {
    try {
      const snapshot = await db.collection('creators')
        .orderBy('followers', 'desc')
        .limit(5)
        .get();

      if (snapshot.empty) {
        // Seed sample creators
        await seedSampleCreators();
        return loadCreators();
      }

      creatorList.innerHTML = '';
      snapshot.forEach(doc => {
        const data = doc.data();
        const item = document.createElement('div');
        item.className = 'profile-item';
        item.innerHTML = `
          <div class="avatar-lg">${data.initials || 'U'}</div>
          <div class="info">
            <div class="name">${data.name || 'User'}</div>
            <div class="handle">${data.handle || '@user'}</div>
          </div>
          <button class="follow-btn ${data.following ? 'following' : ''}" data-creator="${doc.id}">${data.following ? 'Follow' : 'Follow'}</button>
        `;
        creatorList.appendChild(item);
      });

      // Follow buttons
      document.querySelectorAll('.follow-btn').forEach(btn => {
        btn.addEventListener('click', async function(e) {
          e.stopPropagation();
          const creatorId = this.dataset.creator;
          if (!currentUser) {
            showToast('Please sign in to follow creators');
            return;
          }
          const isFollowing = this.classList.contains('following');
          this.classList.toggle('following');
          this.textContent = this.classList.contains('following') ? 'Follow' : 'Follow';
          showToast(this.classList.contains('following') ? 'Following' : 'Unfollowed');
          
          // Update Firebase
          try {
            await db.collection('creators').doc(creatorId).update({
              followers: firebase.firestore.FieldValue.increment(isFollowing ? -1 : 1),
              following: !isFollowing
            });
          } catch (error) {
            console.error('Error updating follow:', error);
          }
        });
      });
    } catch (error) {
      console.error('Error loading creators:', error);
    }
  }

  async function seedSampleCreators() {
    const creators = [
      { name: 'Jane Doe', initials: 'JD', handle: '@janedoe', role: 'economics', followers: 1243 },
      { name: 'Dr. Rivera', initials: 'DR', handle: '@rivera_immuno', role: 'immunology', followers: 892 },
      { name: 'orbitalkate', initials: 'OK', handle: '@orbitalkate', role: 'space', followers: 1567 }
    ];
    const batch = db.batch();
    creators.forEach(creator => {
      const ref = db.collection('creators').doc();
      batch.set(ref, { ...creator, following: false });
    });
    await batch.commit();
  }

  // Load trending topics
  async function loadTrending() {
    try {
      const snapshot = await db.collection('topics')
        .orderBy('trending', 'desc')
        .limit(5)
        .get();

      if (snapshot.empty) {
        await seedSampleTopics();
        return loadTrending();
      }

      trendingList.innerHTML = '';
      snapshot.forEach(doc => {
        const data = doc.data();
        const item = document.createElement('div');
        item.className = 'trend-item';
        item.innerHTML = `
          ${data.name || 'Topic'}
          <span class="topic">${data.category || 'General'}</span>
        `;
        item.addEventListener('click', function() {
          const text = this.textContent.trim().split('\n')[0].trim();
          showToast('Exploring: ' + text);
          // Filter feed by topic
          document.querySelectorAll('.tab').forEach(tab => {
            if (tab.textContent.trim().toLowerCase() === text.toLowerCase()) {
              tab.click();
            }
          });
        });
        trendingList.appendChild(item);
      });
    } catch (error) {
      console.error('Error loading topics:', error);
    }
  }

  async function seedSampleTopics() {
    const topics = [
      { name: 'Federal Reserve rate decision', category: 'Monetary Policy', trending: 92 },
      { name: 'Mars sample return mission', category: 'Space Exploration', trending: 78 },
      { name: 'mRNA vaccine efficacy', category: 'Immunology', trending: 65 },
      { name: 'AI regulation framework', category: 'Technology Policy', trending: 54 }
    ];
    const batch = db.batch();
    topics.forEach(topic => {
      const ref = db.collection('topics').doc();
      batch.set(ref, topic);
    });
    await batch.commit();
  }

  // Tab switching
  const tabs = document.querySelectorAll('.tab');
  let currentTab = 'for-you';

  tabs.forEach(tab => {
    tab.addEventListener('click', function() {
      tabs.forEach(t => t.classList.remove('active'));
      this.classList.add('active');
      currentTab = this.dataset.tab;
      showToast('Showing: ' + this.textContent.trim());
      closeSourcePanel();
      loadFeed(); // Reload feed with filter
    });
  });

  // Bottom bar
  document.querySelectorAll('.bottom-bar svg').forEach((icon) => {
    icon.addEventListener('click', function() {
      document.querySelectorAll('.bottom-bar svg').forEach(s => s.classList.remove('active'));
      this.classList.add('active');
      const tab = this.dataset.tab || 'home';
      showToast('Navigating to: ' + tab.charAt(0).toUpperCase() + tab.slice(1));
      closeSourcePanel();
    });
  });

  // Header icons
  document.querySelectorAll('.header-icons svg').forEach((icon) => {
    icon.addEventListener('click', function() {
      const msgs = ['Search · topic graph', 'Saved collections'];
      const idx = Array.from(this.parentElement.children).indexOf(this) - 1;
      showToast(msgs[idx] || 'Action');
      closeSourcePanel();
    });
  });

  // Out links
  document.addEventListener('click', function(e) {
    const link = e.target.closest('.out-link');
    if (link) {
      e.preventDefault();
      const url = link.dataset.link || 'https://example.com';
      showToast('Opening: ' + url);
      window.open(url, '_blank');
    }
  });

  // Depth nudge
  const depthNudge = document.getElementById('depthNudge');
  let deepMode = false;

  depthNudge.addEventListener('click', function() {
    deepMode = !deepMode;
    const cards = Array.from(feedContainer.querySelectorAll('.card'));
    const articles = cards.filter(c => c.dataset.type === 'article');
    const clips = cards.filter(c => c.dataset.type === 'clip');
    const cardItems = cards.filter(c => c.dataset.type === 'card');
    const newsItems = cards.filter(c => c.dataset.type === 'news');

    if (deepMode) {
      const order = [...articles, ...cardItems, ...clips, ...newsItems];
      feedContainer.innerHTML = '';
      order.forEach(c => feedContainer.appendChild(c));
      depthNudge.innerHTML = `<span>↑</span>  depth mode · articles first  <span class="arrow">↺</span>  <span>RESET</span>`;
      showToast('Depth mode: articles prioritized');
    } else {
      loadFeed();
      depthNudge.innerHTML = `<span>↓</span>  after 2 clips, dive deeper  <span class="arrow">→</span>  <span>ARTICLE</span>`;
      showToast('Mixed feed restored');
    }
    closeSourcePanel();
  });

  // Initialize
  loadFeed();
  loadCreators();
  loadTrending();
  showToast('THE ARK · knowledge feed');

  // Listen for real-time updates
  db.collection('posts')
    .orderBy('timestamp', 'desc')
    .limit(20)
    .onSnapshot((snapshot) => {
      const posts = [];
      snapshot.forEach(doc => {
        posts.push({ id: doc.id, ...doc.data() });
      });
      if (posts.length > 0) {
        renderFeed(posts);
      }
    }, (error) => {
      console.error('Realtime error:', error);
    });
</script>
